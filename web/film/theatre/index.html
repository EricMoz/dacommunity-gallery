<html lang="en">
<head>
  <meta name="site-build" content="20260606-17" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Theatre mode · daCAT Films</title>
  <meta name="description" content="Immersive daCAT community film — theatre mode with full-screen player." />
  <link rel="icon" href="../../assets/brand/dacat-icon-64.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

<body class="film-page film-theater film-theatre-page">
  <div class="film-theater-vignette" aria-hidden="true"></div>
  <div class="film-theatre-popcorn-field" id="theatre-popcorn-field" aria-hidden="true"></div>
  <div class="film-theatre-curtain film-theatre-curtain--left" aria-hidden="true"></div>
  <div class="film-theatre-curtain film-theatre-curtain--right" aria-hidden="true"></div>

  <header class="site-header film-theatre-header">
    <div class="header-inner">
      <a class="brand" href="../" aria-label="daCAT Films">
        <img class="brand-mascot" src="../../assets/brand/dacat-mascot.png" alt="" width="56" height="56" />
        <span class="brand-tag">Theatre</span>
      </a>
      <nav class="header-nav" aria-label="Main">
        <a class="nav-btn nav-btn-home" href="../../">Home</a>
        <a class="nav-btn nav-btn-collections" href="../../collections/">Collections</a>
        <a class="nav-btn nav-btn-film is-active" href="../" aria-current="page">Film</a>
        <a class="nav-btn nav-btn-wallet" href="../../dacommunity/#wallet-panel">My daCATs</a>
        <a class="nav-btn nav-btn-utility" href="https://t.me/daCat_token" target="_blank" rel="noopener">TG</a>
      </nav>
    </div>
  </header>

  <main class="film-theatre-main">
    <nav class="film-theatre-escape" aria-label="Theatre controls">
      <a class="film-theatre-back" href="../">← Film hub</a>
      <button type="button" class="film-theatre-lights-btn" id="theatre-lights" aria-pressed="false">Lights down</button>
    </nav>

    <section class="film-theatre-screen" aria-label="Theatre player">
      <p class="film-theatre-kicker">Theatre mode</p>
      <p class="film-theatre-series" id="theatre-series"></p>
      <h1 class="film-theatre-title" id="theatre-title">Loading…</h1>
      <p class="film-theatre-meta" id="theatre-meta"></p>

      <div class="film-theatre-stage">
        <div class="film-theatre-player" id="theatre-player"></div>
        <p class="film-theatre-loading" id="theatre-loading">Rolling film…</p>
        <p class="film-theatre-error" id="theatre-error" hidden></p>
      </div>

      <p class="film-theatre-popcorn" id="theatre-popcorn">🍿 Grab popcorn — lights down.</p>

      <p class="film-theatre-links">
        <a id="theatre-yt" href="#" target="_blank" rel="noopener noreferrer">Watch on YouTube</a>
      </p>
    </section>
  </main>

  <footer class="site-footer film-footer film-theatre-footer">
    <p><a href="https://www.dacat.fun/">dacat.fun</a> · <a href="https://www.dacatworld.com/">dacatworld</a></p>
    <p class="site-version">Site build 20260606-17</p>
  </footer>

  <script src="../../js/theatre.js?v=20260606-17" defer></script>
