# Weekly identity enrichers — separate from daily OpenSea gallery refresh.
# 1) Base names (web3.bio, no OpenSea key)
# 2) OpenSea profile usernames (same key store/reuse/replace as daily refresh)
name: Enrich wallet names (weekly)

on:
  schedule:
    # Sundays 10:00 UTC — after typical daily refresh window
    - cron: "0 10 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

concurrency:
  group: enrich-wallet-names
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: |
          set -e
          pip install -r backend/requirements.txt

      - name: Enrich Base names
        run: |
          set -e
          cd backend
          python enrich_base_names.py

      # Same OpenSea key lifecycle as refresh-data.yml (store / reuse / replace)
      - name: Restore stored OpenSea key
        uses: actions/cache/restore@v4
        id: restore_opensea_key
        with:
          path: .ci/opensea_instant_key.json
          key: opensea-instant-key-v2-${{ github.run_id }}
          restore-keys: |
            opensea-instant-key-v2-

      - name: Resolve OpenSea API key
        id: generate_key
        env:
          OPENSEA_API_KEY_SECRET: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci_resolve_opensea_key.sh
          scripts/ci_resolve_opensea_key.sh

      - name: Verify OpenSea API key
        id: verify_key
        env:
          OPENSEA_API_KEY: ${{ steps.generate_key.outputs.key }}
        run: |
          set -euo pipefail
          if [ -z "${OPENSEA_API_KEY:-}" ]; then
            echo "::error::No OpenSea API key resolved — cannot enrich usernames."
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o /tmp/opensea_test.json -w "%{http_code}" \
            -H "x-api-key: $OPENSEA_API_KEY" \
            -H "Accept: application/json" \
            -H "User-Agent: dacommunity-gallery-enrich/1.2" \
            --max-time 45 \
            "https://api.opensea.io/api/v2/collections/dacommunity-archive/stats" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::OpenSea key test failed with HTTP $HTTP_CODE (source=${{ steps.generate_key.outputs.source }})."
            head -c 800 /tmp/opensea_test.json || true
            rm -f .ci/opensea_instant_key.json
            exit 1
          fi
          echo "OpenSea API key validated (source=${{ steps.generate_key.outputs.source }})."

      - name: Save stored OpenSea key
        if: success() && steps.generate_key.outputs.should_save == 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/opensea_instant_key.json
          key: opensea-instant-key-v2-${{ github.run_id }}

      - name: Enrich OpenSea profile usernames
        env:
          OPENSEA_API_KEY: ${{ steps.generate_key.outputs.key }}
        run: |
          set -e
          cd backend
          # Prefer wallets that would otherwise display as short 0x (no ENS/Base/username).
          # Then refresh unchecked / stale profiles (21d cache).
          python enrich_opensea_profiles.py --prefer-bare

      - name: Commit name updates
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/name_index.json web/data/wallet_index.json
          if git diff --staged --quiet; then
            echo "No name changes."
            exit 0
          fi
          git commit -m "chore: weekly wallet name enrich ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main || git pull --autostash origin main || true
          git push origin main || git push origin main --force-with-lease || echo "::warning::Push may have raced; next weekly run will retry."
