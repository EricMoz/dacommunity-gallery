# Weekly Base-name enricher — separate from daily OpenSea refresh.
# Uses public web3.bio profiles only (no OpenSea key). Safe to fail independently.
name: Enrich Base names (weekly)

on:
  schedule:
    # Sundays 10:00 UTC — after typical daily refresh window
    - cron: "0 10 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

concurrency:
  group: enrich-base-names
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          set -e
          pip install -r backend/requirements.txt

      - name: Enrich Base names
        run: |
          set -e
          cd backend
          python enrich_base_names.py

      - name: Commit name index
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/name_index.json web/data/wallet_index.json
          if git diff --staged --quiet; then
            echo "No Base-name changes."
            exit 0
          fi
          git commit -m "chore: weekly Base-name enrich ($(date -u +%Y-%m-%d))"
          git pull --rebase --autostash origin main || git pull --autostash origin main || true
          git push origin main || git push origin main --force-with-lease || echo "::warning::Push may have raced; next weekly run will retry."
