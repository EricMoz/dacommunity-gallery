# Fetches OpenSea data and commits JSON. Requires repository secret OPENSEA_API_KEY.
#
# LFS optimization: this workflow only updates web/data/*.json — it does not read or
# write NFT images under web/assets/. Checkout uses lfs: false so the daily run does not
# pull every LFS-tracked image (bandwidth-heavy; images change only when collections are added).
# Deploy caches LFS assets and only re-pulls when web/assets/ changes — see deploy-pages.yml.
name: Refresh gallery data (daily)

on:
  schedule:
    # 08:00 UTC daily (~3–4 AM US Eastern; GitHub may start runs a few minutes late)
    - cron: "0 8 * * *"
  workflow_dispatch:

env:
  # Force Node 24 for any lingering old actions (checkout@v5+ is native node24)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-gallery-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Skip LFS: fetch_gallery_data.py only writes JSON; images rarely change and are
      # not needed here. Use lfs: true only in deploy/build jobs that serve web/assets/.
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify OpenSea API key secret
        id: verify_secret
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          set -e
          if [ -z "$OPENSEA_API_KEY" ]; then
            echo "::error::Repository secret OPENSEA_API_KEY is missing. Add it under Settings → Secrets and variables → Actions (see README)."
            exit 1
          fi
          echo "OpenSea API key is set. Testing with lightweight call..."
          # Lightweight validation (no full fetch) to catch expired/invalid keys early
          HTTP_CODE=$(curl -s -o /tmp/opensea_test.json -w "%{http_code}" \
            -H "x-api-key: $OPENSEA_API_KEY" \
            -H "Accept: application/json" \
            "https://api.opensea.io/api/v2/collections/rodeo-posts-12142/stats" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::OpenSea key test failed with HTTP $HTTP_CODE. Key may be expired/invalid (instant keys ~30d lifetime) or rate limited. Check secret and renew at https://docs.opensea.io/reference/api-keys"
            cat /tmp/opensea_test.json || true
            exit 1
          fi
          echo "OpenSea API key validated successfully (200 OK)."

      - name: Fetch from OpenSea
        id: fetch
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          set -e
          pip install -r backend/requirements.txt
          cd backend
          python fetch_gallery_data.py

      - name: Fetch badges (for owners/dates)
        if: success()
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          set -e
          cd backend
          python fetch_badges.py
          # promote latest proposed
          cp review/$(ls review/badges_proposed_*.json | tail -1 | xargs basename) ../web/data/badges_data.json
          python build_badges_catalog.py

      - name: Record refresh failure
        if: failure()
        run: |
          pip install -r backend/requirements.txt
          CODE="fetch_failed"
          ERROR="Refresh job failed — see the log for the failing step."
          if [ "${{ steps.verify_secret.outcome }}" = "failure" ]; then
            CODE="missing_secret"
            ERROR="Repository secret OPENSEA_API_KEY is not set."
          fi
          python backend/gallery_meta.py --record-failure --error "$ERROR" --error-code "$CODE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/gallery_meta.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: record failed gallery refresh"
            # Simple push for failure meta; avoid complex rebase to prevent exhaustion
            git push origin main || echo "::warning::Failure meta push exhausted (will rely on next successful run)"
          else
            echo "No meta change to record"
          fi

      - name: Commit updated data
        id: commit
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/gallery_data.json web/data/gallery_catalog.json web/data/wallet_index.json web/data/gallery_meta.json web/data/badges_data.json web/data/badges_catalog.json
          if git diff --staged --quiet; then
            echo "No JSON changes — OpenSea data already up to date."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "chore: daily refresh from OpenSea ($(date -u +%Y-%m-%d))"
          # Robust push with limited retries (handles transient remote changes / rebase races)
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              if git push origin main; then
                echo "Successfully pushed on attempt $attempt"
                break
              fi
            else
              echo "Rebase failed on attempt $attempt, aborting rebase"
              git rebase --abort || true
            fi
            if [ $attempt -lt 3 ]; then
              echo "Retrying in 10s..."
              sleep 10
            else
              echo "::warning::Push attempts exhausted. Data may not be on remote (concurrent edit or protected branch?)."
            fi
          done
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Trigger Deploy gallery to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering deploy workflow after successful data commit (note: push to main will also trigger it automatically)"
          gh workflow run "Deploy gallery to GitHub Pages" --repo ${{ github.repository }} --ref main || echo "gh dispatch failed (harmless if push event already queued deploy)"