name: Refresh gallery data (daily)

on:
  schedule:
    # 08:00 UTC daily — ownership, listings, stats stay current after transfers
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch from OpenSea
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          pip install -r backend/requirements.txt
          cd backend
          python fetch_gallery_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/gallery_data.json web/data/wallet_index.json
          git diff --staged --quiet || git commit -m "chore: daily refresh from OpenSea (owners, listings, stats)"
          git push