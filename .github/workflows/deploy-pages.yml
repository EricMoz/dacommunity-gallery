# Publishes web/ to GitHub Pages.
#
# LFS optimization: checkout uses lfs: false. .git/lfs + web/assets are restored from
# Actions cache when asset pointers are unchanged. git lfs pull only fetches missing
# objects (cheap on daily JSON-only pushes). Full pull happens on cache miss or when
# web/assets/ changes. Daily refresh never pulls LFS — see refresh-data.yml.
name: Deploy gallery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Do not use lfs: true — it re-downloads every image each run. Materialize below.
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      - name: Restore LFS asset cache
        uses: actions/cache@v4
        id: lfs-cache
        with:
          path: |
            .git/lfs
            web/assets
          key: gallery-lfs-v1-${{ hashFiles('.gitattributes') }}-assets-${{ hashFiles('web/assets/**') }}
          restore-keys: |
            gallery-lfs-v1-${{ hashFiles('.gitattributes') }}-assets-
            gallery-lfs-v1-${{ hashFiles('.gitattributes') }}-

      - name: Materialize LFS assets
        run: |
          set -e
          git lfs install

          ASSETS_CHANGED=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^web/assets/'; then
              ASSETS_CHANGED=true
              echo "web/assets/ changed — will sync LFS objects"
            fi
          fi

          NEED_PULL=false
          for probe in web/assets/brand/dacat-mascot.png web/assets/nfts/dacat_drive.jpg; do
            if [ ! -f "$probe" ] || head -c 8 "$probe" | grep -q "version"; then
              NEED_PULL=true
              echo "Asset missing or still a pointer: $probe"
              break
            fi
          done

          if [ "$ASSETS_CHANGED" = true ] || [ "$NEED_PULL" = true ] || [ "${{ steps.lfs-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Running git lfs pull (incremental — local/cache objects are reused)"
            git lfs pull --include="web/assets/**"
          else
            echo "Cache hit and assets materialized — skipping LFS download"
          fi

          for probe in web/assets/brand/dacat-mascot.png web/assets/nfts/dacat_drive.jpg; do
            if [ ! -f "$probe" ]; then
              echo "::error::Missing asset after LFS step: $probe"
              exit 1
            fi
            if head -c 8 "$probe" | grep -q "version"; then
              echo "::error::Asset still an LFS pointer after pull: $probe"
              exit 1
            fi
          done
          echo "LFS assets OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Bump deploy build stamp
        run: python scripts/bump_deploy_version.py

      - name: Verify site files
        run: |
          set -e
          BUILD=$(cat web/VERSION.txt)
          echo "Publishing site build ${BUILD}"
          test -f web/VERSION.txt || (echo "Missing web/VERSION.txt — bump step failed" && exit 1)
          test -f web/BUILD.json || (echo "Missing web/BUILD.json — bump step failed" && exit 1)
          grep -q "Site build ${BUILD}" web/dacommunity/index.html || (echo "dacommunity footer missing build stamp" && exit 1)
          node --check web/js/app.js || (echo "app.js has a syntax error — gallery will never load" && exit 1)
          node --check web/js/film.js || (echo "film.js has a syntax error" && exit 1)
          test -f web/data/videos.json || (echo "Missing web/data/videos.json" && exit 1)
          grep -q "film-hub-page" web/film/index.html || (echo "film/index.html missing film hub markup" && exit 1)
          grep -q "film-featured" web/film/index.html || (echo "film/index.html missing Featured section" && exit 1)
          grep -q '"featuredIds"' web/data/videos.json || (echo "videos.json missing featuredIds" && exit 1)
          test -f web/index.html || (echo "Missing web/index.html" && exit 1)
          test -f web/dacommunity/index.html || (echo "Missing web/dacommunity/index.html" && exit 1)
          test -f web/badges/index.html || (echo "Missing web/badges/index.html" && exit 1)
          test -f web/analytics/index.html || (echo "Missing web/analytics/index.html" && exit 1)
          test -f web/film/index.html || (echo "Missing web/film/index.html" && exit 1)
          test -f web/film/mozvane/index.html || (echo "Missing web/film/mozvane/index.html" && exit 1)
          test -f web/collections/index.html || (echo "Missing web/collections/index.html" && exit 1)
          grep -q "Film &amp; comics" web/index.html || (echo "Homepage missing Film & comics section — stale index?" && exit 1)
          grep -q "daCAT Chronicles" web/index.html || (echo "Homepage missing Chronicles card" && exit 1)
          test -f web/manifest.webmanifest || (echo "Missing web/manifest.webmanifest" && exit 1)
          test -f web/sw.js || (echo "Missing web/sw.js" && exit 1)
          test -f web/data/gallery_catalog.json || (echo "Missing gallery_catalog.json — run: cd backend && python build_catalog.py" && exit 1)
          PYTHONPATH=backend python backend/enrich_gallery_json.py || (echo "enrich_gallery_json failed — check owner_stats import" && exit 1)
          PYTHONPATH=backend python backend/build_catalog.py || (echo "build_catalog failed" && exit 1)
          test -f web/data/gallery_data.json || (echo "Missing gallery_data.json — run fetch locally first" && exit 1)
          echo "Site files OK"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4