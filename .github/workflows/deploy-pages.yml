name: Deploy gallery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify site files
        run: |
          test -f web/index.html || (echo "Missing web/index.html" && exit 1)
          test -f web/data/gallery_catalog.json || (echo "Missing gallery_catalog.json — run: cd backend && python build_catalog.py" && exit 1)
          test -f web/data/gallery_data.json || (echo "Missing gallery_data.json — run fetch locally first" && exit 1)
          echo "Site files OK"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4