# Publishes web/ to GitHub Pages. Requires LFS for NFT images in assets/.
name: Deploy gallery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Bump deploy build stamp
        run: python scripts/bump_deploy_version.py

      - name: Verify site files
        run: |
          set -e
          BUILD=$(cat web/VERSION.txt)
          echo "Publishing site build ${BUILD}"
          test -f web/VERSION.txt || (echo "Missing web/VERSION.txt — bump step failed" && exit 1)
          test -f web/BUILD.json || (echo "Missing web/BUILD.json — bump step failed" && exit 1)
          grep -q "Site build ${BUILD}" web/dacommunity/index.html || (echo "dacommunity footer missing build stamp" && exit 1)
          node --check web/js/app.js || (echo "app.js has a syntax error — gallery will never load" && exit 1)
          test -f web/index.html || (echo "Missing web/index.html" && exit 1)
          test -f web/dacommunity/index.html || (echo "Missing web/dacommunity/index.html" && exit 1)
          test -f web/badges/index.html || (echo "Missing web/badges/index.html" && exit 1)
          test -f web/analytics/index.html || (echo "Missing web/analytics/index.html" && exit 1)
          test -f web/film/index.html || (echo "Missing web/film/index.html" && exit 1)
          test -f web/film/mozvane/index.html || (echo "Missing web/film/mozvane/index.html" && exit 1)
          test -f web/collections/index.html || (echo "Missing web/collections/index.html" && exit 1)
          grep -q "Film &amp; comics" web/index.html || (echo "Homepage missing Film & comics section — stale index?" && exit 1)
          grep -q "daCAT Chronicles" web/index.html || (echo "Homepage missing Chronicles card" && exit 1)
          test -f web/manifest.webmanifest || (echo "Missing web/manifest.webmanifest" && exit 1)
          test -f web/sw.js || (echo "Missing web/sw.js" && exit 1)
          test -f web/data/gallery_catalog.json || (echo "Missing gallery_catalog.json — run: cd backend && python build_catalog.py" && exit 1)
          python backend/enrich_gallery_json.py || (echo "enrich_gallery_json failed — check owner_stats import" && exit 1)
          python backend/build_catalog.py || (echo "build_catalog failed" && exit 1)
          test -f web/data/gallery_data.json || (echo "Missing gallery_data.json — run fetch locally first" && exit 1)
          echo "Site files OK"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4