# One-off / on-demand Agency volumes fetch (Vol 1–N from registry).
# Uses the same OpenSea key resolve path as daily refresh — no full gallery crawl.
name: Fetch daGATO Agency

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-dagato-agency
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      - name: Restore stored OpenSea key
        uses: actions/cache/restore@v4
        id: restore_opensea_key
        with:
          path: .ci/opensea_instant_key.json
          key: opensea-instant-key-v2-${{ github.run_id }}
          restore-keys: |
            opensea-instant-key-v2-

      - name: Resolve OpenSea API key
        id: generate_key
        env:
          OPENSEA_API_KEY_SECRET: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci_resolve_opensea_key.sh
          scripts/ci_resolve_opensea_key.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify OpenSea API key
        env:
          OPENSEA_API_KEY: ${{ steps.generate_key.outputs.key }}
        run: |
          set -euo pipefail
          if [ -z "${OPENSEA_API_KEY:-}" ]; then
            echo "::error::No OpenSea API key resolved."
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o /tmp/opensea_test.json -w "%{http_code}" \
            -H "x-api-key: $OPENSEA_API_KEY" \
            -H "Accept: application/json" \
            -H "User-Agent: dacommunity-gallery-agency/1.0" \
            --max-time 45 \
            "https://api.opensea.io/api/v2/collections/dagato-detective-agency-volume-3/stats" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::OpenSea key test failed HTTP $HTTP_CODE"
            head -c 800 /tmp/opensea_test.json || true
            exit 1
          fi
          echo "OpenSea key OK (source=${{ steps.generate_key.outputs.source }})"

      - name: Save OpenSea key store
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .ci/opensea_instant_key.json
          key: opensea-instant-key-v2-${{ github.run_id }}

      - name: Install Python deps
        run: pip install -r backend/requirements.txt

      - name: Fetch daGATO Detective Agency (all volumes)
        env:
          OPENSEA_API_KEY: ${{ steps.generate_key.outputs.key }}
        run: |
          set -e
          cd backend
          python fetch_dagato_agency.py

      - name: Commit Agency data
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/dagato_agency_data.json web/data/dagato_agency_catalog.json web/data/collections_registry.json || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Agency data changes to commit."
          else
            git commit -m "chore: fetch daGATO Agency volumes (incl. Vol 3)"
            git push origin HEAD:${{ github.ref_name }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Deploy gallery to GitHub Pages" --ref "${{ github.ref_name }}"
